name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main ]

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Automatically extracts web Firebase config from your existing GitHub Secret
      - name: Extract Firebase Web Config from FIREBASE_OPTIONS_DART
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          node -e '
            const fs = require("fs");
            const secret = process.env.FIREBASE_OPTIONS_DART || "";
            const match = secret.match(/static const FirebaseOptions web = FirebaseOptions\(([\s\S]*?)\);/);
            if (match) {
              const block = match[1];
              const extract = (key) => {
                const m = block.match(new RegExp(key + ":\\s*[\x27\x22]([^\x27\x22]+)[\x27\x22]"));
                return m ? m[1] : "";
              };
              const env = [
                `VITE_FIREBASE_API_KEY=${extract("apiKey")}`,
                `VITE_FIREBASE_APP_ID=${extract("appId")}`,
                `VITE_FIREBASE_MESSAGING_SENDER_ID=${extract("messagingSenderId")}`,
                `VITE_FIREBASE_PROJECT_ID=${extract("projectId")}`,
                `VITE_FIREBASE_AUTH_DOMAIN=${extract("authDomain")}`,
                `VITE_FIREBASE_STORAGE_BUCKET=${extract("storageBucket")}`
              ].join("\n");
              fs.writeFileSync(".env.local", env);
              console.log("Successfully extracted Firebase web credentials from FIREBASE_OPTIONS_DART");
            } else {
              console.warn("Could not find web options in FIREBASE_OPTIONS_DART. Ensure the secret is set in repository settings.");
            }
          '

      - name: Run Tests
        run: npm test

      - name: Build Web App
        run: npm run build
        env:
          BASE_PATH: /oikonomos/

      # SPA routing fallback for GitHub Pages
      - name: Create 404.html fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
